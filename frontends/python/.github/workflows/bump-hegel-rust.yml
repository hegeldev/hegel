name: Bump hegel-rust

on:
  # Fired by hegel-rust's release workflow when it publishes a new libhegel;
  # client_payload.version carries the released hegel-c (`hegeltest-c`)
  # version so we pin that exact release rather than racing on latest.
  repository_dispatch:
    types: [hegel-rust-release]
  # Manual escape hatch: run with an empty version to pin the latest
  # `hegeltest-c` on crates.io, or supply a specific version.
  workflow_dispatch:
    inputs:
      version:
        description: "hegeltest-c version to pin (empty = latest on crates.io)"
        required: false
        default: ""

permissions: {}

jobs:
  bump:
    name: bump hegel-rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel-python
          # Pushing the bump branch and opening, editing, closing and
          # commenting on bump PRs; nothing else.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }} # zizmor: ignore[artipacked]

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Bump pinned libhegel
        id: bump
        env:
          HEGEL_RELEASE_APP_ID: ${{ vars.HEGEL_RELEASE_APP_ID }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: python3 .github/scripts/bump_hegel_rust.py "$VERSION"

      - name: Set up the environment
        if: steps.bump.outputs.bumped == 'true'
        run: just setup

      # The bump only changes the pin. The C ABI may have shifted with the new
      # release, and engine fixes may have resolved divergences we record, so
      # realign the bindings before the PR is reviewed. Skipped when nothing
      # was bumped.
      - name: Align the bindings to the new libhegel
        if: steps.bump.outputs.bumped == 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4d7e1f0cd85743fdc93b1c8040ab54395da024e2 # v1.0.149
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          # hegel-rust fires this workflow via repository_dispatch using the
          # hegel-release[bot] app token, so the actor is a bot. The action
          # blocks bot-initiated runs by default; allow this specific bot.
          allowed_bots: hegel-release
          prompt: |
            The pinned libhegel (the `hegeltest-c` crate) was just bumped to
            ${{ steps.bump.outputs.version }} in Cargo.toml and Cargo.lock on this checkout, and
            `just setup` has been run. Align the pyo3 bindings (src/*.rs, plus
            python/hegel/_native.pyi and the Python callers only where the ABI demands
            it) to the new release so that `just build` and `just check` pass. Do NOT
            change the public `hegel` API. Engine divergences are recorded in
            docs/engine-issues.md with strict xfails rather than worked around in the
            bindings: if an xfail now passes because the engine fixed it, remove the
            xfail and its entry; if a new divergence appears, add an entry and an
            xfail rather than a workaround. Do NOT commit or push; leave all changes
            in the working tree for the next step to commit.
          claude_args: >-
            --allowed-tools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,Skill"
            --max-turns 60

      # Fold the alignment into the bump commit so the branch carries a
      # single bump+fix commit. No-op when alignment changed nothing.
      - name: Amend the alignment into the bump commit
        if: steps.bump.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No alignment changes to amend."
            exit 0
          fi
          git add -A
          git commit --amend --no-edit

      # The single push: force-push the per-version branch and open/update the
      # PR. The branch name embeds the pinned version, so the force-push only
      # ever overwrites a re-run of this same version, never another
      # version's (or a human's) work.
      - name: Push and open/update the PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          git push --force origin "$BRANCH"

          workflow_url="https://github.com/hegeldev/hegel-python/blob/main/.github/workflows/bump-hegel-rust.yml"
          release_url="https://github.com/hegeldev/hegel-rust/releases/tag/libhegel-v${VERSION}"
          title="Bump pinned \`libhegel\` to \`${VERSION}\`"
          body=$(printf '%s\n' \
            "This PR bumps our pinned \`hegeltest-c\` (libhegel) to [\`${VERSION}\`](${release_url})." \
            "" \
            "---" \
            "" \
            "*This PR was automatically generated by [bump-hegel-rust.yml](${workflow_url}).*")

          # Reuse the open PR for this branch if there is one; otherwise create it.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --title "$title" --body "$body"
          fi

      # Older bump PRs are now superseded by this one. Close the ones that
      # carry only bot commits; a PR someone pushed work to is left open with
      # a note instead, since closing must never bury manual work. Best-effort:
      # a hiccup here must not fail the bump itself.
      - name: Supersede older bump PRs
        if: steps.bump.outputs.bumped == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          new_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          gh pr list --state open --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' |
          while IFS=$'\t' read -r pr head; do
            [ "$head" = "$BRANCH" ] && continue
            case "$head" in
              ci/bump-hegel-rust-*) ;;
              *) continue ;;
            esac
            # Authors other than the bot on the PR's commits? (GraphQL reports
            # the bot's login without the [bot] suffix; check both spellings.)
            # Bot commits can carry an empty-string login, so fall through to
            # the name explicitly; an author with neither is treated as human.
            others=$(gh pr view "$pr" --json commits \
              --jq '[.commits[].authors[] | (if (.login // "") != "" then .login elif (.name // "") != "" then .name else "unknown author" end)] | unique
                    | map(select(. != "hegel-release" and . != "hegel-release[bot]"))
                    | join(", ")')
            if [ -z "$others" ]; then
              gh pr close "$pr" --comment "Superseded by #${new_pr}, which pins libhegel ${VERSION}."
            else
              gh pr comment "$pr" --body "Superseded by #${new_pr}, which pins libhegel ${VERSION}. Leaving this PR open because it carries commits by: ${others}."
            fi
          done
