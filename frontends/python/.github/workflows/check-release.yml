name: Check release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  check-release:
    name: check release
    # Releases are switched off while hegel-python is only shared internally
    # (see the release job in ci.yml). To turn this back on, restore:
    #   "!contains(github.event.pull_request.labels.*.name, 'skip release')"
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/release.py check "$BASE_REF"
