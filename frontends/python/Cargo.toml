[package]
name = "hegel-python"
version = "0.2.2"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Python bindings to the Hegel property-based testing engine."
repository = "https://github.com/hegeldev/hegel"
publish = false

[lints]
workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["num-bigint"] }
num-bigint = "0.4"
hegeltest-c = { path = "../../libhegel", default-features = false, features = ["std"] }
