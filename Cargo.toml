[package]
name = "hegel-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Python bindings to the Hegel property-based testing engine."
repository = "https://github.com/hegeldev/hegel-python"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["num-bigint"] }
num-bigint = "0.4"
hegeltest-c = { version = "=0.45.13", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
debug = false
