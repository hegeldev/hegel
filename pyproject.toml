[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "hegel"
version = "0.1.0"
description = "Property-based testing for Python, built on the Hegel engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hegel developers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://hegel.dev"
Repository = "https://github.com/hegeldev/hegel-python"

[project.entry-points.pytest11]
hegel = "hegel.pytest_plugin"

[tool.maturin]
python-source = "python"
module-name = "hegel._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "coverage>=7",
  "ruff>=0.6",
  "mypy>=1.11",
  "maturin>=1.7,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p pytester"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E741", "B008", "B023", "B904", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/hypothesis_port/**" = ["E", "F", "I", "UP", "B", "W"]

[tool.coverage.run]
branch = true
source = ["hegel"]
omit = ["python/hegel/hypothesis/*", "python/hegel/_native.pyi"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["nocov", "if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
