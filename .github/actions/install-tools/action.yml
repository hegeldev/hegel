name: Install tools
inputs:
  tools:
    required: true
runs:
  using: composite
  steps:
    - id: parse
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        for tool in $TOOLS; do
          case "$tool" in
            just|uv|doxygen) echo "$tool=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown tool: $tool"; exit 1 ;;
          esac
        done
      shell: bash
    # The justfiles use modules (`mod`), which need a newer `just` than the
    # distro packages ship, and the chocolatey community feed regularly
    # times out while `choco install` exits 0 even when it installed
    # nothing. So on Linux and Windows fetch the pinned release straight
    # from GitHub and verify its checksum. To bump: take the new version
    # and the matching lines from
    # https://github.com/casey/just/releases/download/<version>/SHA256SUMS.
    - if: steps.parse.outputs.just == 'true' && runner.os == 'Linux'
      env:
        JUST_VERSION: 1.59.0
        JUST_SHA256_X86_64: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        JUST_SHA256_AARCH64: 23871b1702bfd550fb5f901778fd4290ecf2ee034a45a889fbe96d89b188086d
      # The GITHUB_PATH write only matters under pull_request_target, which
      # no workflow here uses.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=x86_64; sha="$JUST_SHA256_X86_64" ;;
          aarch64) arch=aarch64; sha="$JUST_SHA256_AARCH64" ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        archive="just-${JUST_VERSION}-${arch}-unknown-linux-musl.tar.gz"
        dir="$RUNNER_TEMP/just-${JUST_VERSION}"
        mkdir -p "$dir"
        curl -sSfL --retry 5 --retry-delay 10 -o "$dir/$archive" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/$archive"
        echo "$sha  $dir/$archive" | sha256sum -c -
        tar -xzf "$dir/$archive" -C "$dir" just
        echo "$dir" >> "$GITHUB_PATH"
      shell: bash
    - if: steps.parse.outputs.just == 'true' && runner.os == 'Windows'
      env:
        JUST_VERSION: 1.59.0
        JUST_SHA256: 9c5463e2d0974e31bee71346aa5cbf19167de1585a4abc1bae7b3b04604ea9c0
      # The GITHUB_PATH write only matters under pull_request_target, which
      # no workflow here uses.
      run: | # zizmor: ignore[github-env]
        $ErrorActionPreference = 'Stop'
        $archive = "just-${env:JUST_VERSION}-x86_64-pc-windows-msvc.zip"
        $dir = Join-Path $env:RUNNER_TEMP "just-${env:JUST_VERSION}"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $zip = Join-Path $dir $archive
        Invoke-WebRequest `
          -Uri "https://github.com/casey/just/releases/download/${env:JUST_VERSION}/$archive" `
          -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 10
        $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
        if ($actual -ne ${env:JUST_SHA256}) {
          throw "SHA256 mismatch for ${archive}: expected ${env:JUST_SHA256}, got $actual"
        }
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        Add-Content -Path $env:GITHUB_PATH -Value $dir
      shell: pwsh
    - if: steps.parse.outputs.just == 'true' && runner.os == 'macOS'
      run: brew install just
      shell: bash
    # Fail here, with a clear message, rather than at the first recipe.
    - if: steps.parse.outputs.just == 'true'
      run: just --version
      shell: bash
    - if: steps.parse.outputs.uv == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    # Ubuntu's packaged doxygen is 1.9.8, which has a parallel-dot race that
    # spuriously reports "problems opening map file" and trips WARN_AS_ERROR.
    # Fixed in 1.10+, so the upstream Linux binary is pinned instead.
    - if: steps.parse.outputs.doxygen == 'true'
      env:
        DOXYGEN_VERSION: 1.15.0
        DOXYGEN_SHA256: 0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1
      run: |
        set -euo pipefail
        sudo apt-get update && sudo apt-get install -y graphviz
        DOXYGEN_TAG="Release_${DOXYGEN_VERSION//./_}"
        curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/doxygen.tar.gz" \
          "https://github.com/doxygen/doxygen/releases/download/${DOXYGEN_TAG}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        echo "${DOXYGEN_SHA256}  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C /opt
        sudo ln -sf "/opt/doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
        doxygen --version
      shell: bash
