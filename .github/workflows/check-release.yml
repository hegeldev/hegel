name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue requires this check too. The pull request already ran it,
  # and a merge queue run cannot see the PR's labels, so there the job is
  # skipped, which counts as passing.
  merge_group:

permissions: {}

jobs:
  check-release:
    name: check release
    if: "github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip release')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/release.py check "$BASE_REF"
