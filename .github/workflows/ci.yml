name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Set up the environment
        run: just setup
      - name: Check formatting
        run: just check-format
      - name: Check lint
        run: just check-lint
      - name: Check types
        run: just check-types
      - name: Check zizmor
        run: |
          pipx install zizmor==1.23.1
          zizmor --format plain .github/

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install just
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install just; else sudo apt-get update && sudo apt-get install -y just; fi
      - name: Set up the environment
        run: just setup
      - name: Run the test suite with coverage
        run: just check-coverage
      - name: Run the ported Hypothesis test suite
        run: just check-hypothesis-port
