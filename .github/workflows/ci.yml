name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Set up the environment
        run: just setup
      - name: Check formatting
        run: just check-format
      - name: Check lint
        run: just check-lint
      - name: Check types
        run: just check-types
      - name: Test the release script
        run: just check-release-script
      - name: Check zizmor
        run: |
          pipx install zizmor==1.23.1
          zizmor --format plain .github/

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install just
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install just; else sudo apt-get update && sudo apt-get install -y just; fi
      - name: Set up the environment
        run: just setup
      - name: Run the test suite with coverage
        run: just check-coverage
      - name: Run the ported Hypothesis test suite
        run: just check-hypothesis-port

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Build a wheel and an sdist
        run: |
          uvx --from 'maturin>=1.7,<2.0' maturin build --release --out dist
          uvx --from 'maturin>=1.7,<2.0' maturin sdist --out dist
          ls -l dist
      - name: Install the wheel into a fresh virtualenv
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
      - name: Import the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/check_installed.py"
      - name: Build and install the sdist into a fresh virtualenv
        run: |
          uv venv "$RUNNER_TEMP/sdist-venv"
          uv pip install --python "$RUNNER_TEMP/sdist-venv/bin/python" dist/*.tar.gz
      - name: Import the package built from the sdist
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/sdist-venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/check_installed.py"

  release:
    name: release
    # Releases are switched off while hegel-python is only shared internally.
    # To turn them back on, restore this condition:
    #   github.event_name == 'push' && github.repository == 'hegeldev/hegel-python'
    if: false
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check for RELEASE.md
        id: check
        run: |
          if [ ! -f RELEASE.md ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        if: steps.check.outputs.skip != 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel-python
          # Pushing main and the tag and creating the GitHub release; if main
          # has moved, pushing a branch, creating the "skip release" label
          # (an issues permission) and opening a PR.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Re-checkout with app token # zizmor: ignore[artipacked]
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-tags: true

      # release.py runs `cargo update --workspace` to record the new version
      # in Cargo.lock.
      - name: Install Rust
        if: steps.check.outputs.skip != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEGEL_RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 .github/scripts/release.py release

      - name: Push the release commit
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/release.py push-or-pr
