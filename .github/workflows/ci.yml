# The CI entry point. Works out which components a change touches, runs the
# workspace-wide checks, calls each component's reusable workflow
# (libhegel.yml, frontend-rust.yml, frontend-python.yml) only when that
# component is affected, and — on a push to main — releases whatever has a
# RELEASE.md.
#
# Adding a frontend: add a `frontends/<lang>/**` filter below, a
# `.github/workflows/frontend-<lang>.yml` reusable workflow, a job here that
# calls it, list that job in the `ci-ok` and `release` jobs' `needs`, add
# the component to `COMPONENTS` in `.github/scripts/release.py`, and give
# the release job (plus any follow-on publish jobs) its publishing steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo changed. On a push to main everything is treated
  # as changed, so the release job always has a complete run behind it; on a
  # pull request only the affected components' workflows run. Branch
  # protection requires `ci-ok` below rather than the component jobs, since a
  # skipped reusable workflow reports no check runs at all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      libhegel: ${{ github.event_name != 'pull_request' || steps.filter.outputs.libhegel == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # `shared` is everything the Cargo workspace members have in common:
          # a change there re-runs every component. libhegel is a dependency
          # of every frontend, so a libhegel change re-runs the frontends too.
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'justfile'
              - 'scripts/**'
              - 'nix/**'
              - '.github/**'
            libhegel:
              - *shared
              - 'libhegel/**'
            rust:
              - *shared
              - 'libhegel/**'
              - 'frontends/rust/**'
            python:
              - *shared
              - 'libhegel/**'
              - 'frontends/python/**'

  # Workspace-wide lints: formatting, clippy, the scripts/check-*.py lints,
  # each component's own lints (via `just check-lint`), the workflow lint and
  # a packaging dry run. Cheap enough to run on every change.
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt clippy
          # The Python frontend's lints (ruff, mypy) run in its virtualenv.
          tools: just uv
      - name: Set up the Python frontend
        run: just python::setup
      - name: Check lint
        run: just check-lint
      - name: Check zizmor
        run: |
          pipx install zizmor==1.23.1
          zizmor --format plain .github/
      - name: Check `cargo package`
        # creates a .crate for distribution and verifies it can build in isolation
        # see https://doc.rust-lang.org/cargo/commands/cargo-package.html
        #
        # The packaged hegeltest has no libhegel/ sibling, so its build.rs
        # would fetch the pinned hegeltest-c from crates.io — which does not
        # exist yet on a release PR. HEGEL_C_LIB_DIR short-circuits that with
        # the cdylib built from this checkout. The Python extension crate is
        # never published to crates.io (maturin packages it), so it is left
        # out.
        run: |
          cargo build -p hegeltest-c
          HEGEL_C_LIB_DIR="$PWD/target/debug" cargo package --workspace --exclude hegel-python

  libhegel:
    name: libhegel
    needs: changes
    if: needs.changes.outputs.libhegel == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/libhegel.yml

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-rust.yml

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-python.yml

  # Test with the minimal versions of every dependency in the workspace.
  # `ubuntu-8-core` is an org larger runner (Settings → Actions → Runners):
  # this and `coverage` are the longest jobs in a run, and larger runners
  # don't count against the plan's cap on concurrent standard-runner jobs.
  test-minimal-versions:
    name: test-minimal-versions
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-8-core
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - name: Run tests
        run: just check-tests-minimal-versions

  # Coverage is measured over the whole Cargo workspace (the engine is
  # covered by its own tests and by the Rust frontend driving it), so it
  # runs whenever either changed.
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-8-core
    permissions:
      contents: write  # needed for ratchet auto-update
      pull-requests: write  # needed for creating PRs on main
    steps:
      # For fork PRs, head_ref points to a branch that doesn't exist on the base repo,
      # so we fall back to the default ref (the merge commit).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          persist-credentials: false

      # use an app token so that the commit re-triggers CI. GITHUB_TOKEN pushes don't trigger CI
      - name: Generate app token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # zizmor: ignore[artipacked]
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          # `uv` is needed for the `check-coverage.py` script's
          # `#!/usr/bin/env -S uv run --script` shebang.
          tools: just uv
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov

      - name: Run coverage
        run: just check-coverage

      - name: Auto-update coverage annotations and ratchet
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "No coverage annotation changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u

          if git diff --cached --quiet; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git commit -m "Auto-update coverage annotations and ratchet"
            git push
          else
            BRANCH="auto/coverage-ratchet-update"
            git checkout -b "$BRANCH"
            git commit -m "Auto-update coverage annotations and ratchet"
            git push -f origin "$BRANCH"
            gh pr create \
              --title "Auto-update coverage ratchet" \
              --body "The coverage ratchet has tightened on main. This PR updates the ratchet file and removes unnecessary annotations." \
              --base main \
              --head "$BRANCH" || true
          fi

  nix:
    name: nix
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
      - uses: ./.github/actions/install-tools
        with:
          tools: just
      - name: lint
        run: just check-format-nix

  # The one check branch protection requires. Jobs inside a skipped reusable
  # workflow never report a check run, so requiring `libhegel / test` directly
  # would block every frontend-only PR; this job always runs and fails only
  # when something it depends on failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, libhegel, rust, python, test-minimal-versions, coverage, nix]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check dependency results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi

  release:
    name: release
    # On a push every component ran (see `changes`), so a plain success of
    # every dependency is required; the `!cancelled()` form is what lets this
    # job evaluate its condition at all when a dependency was skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.repository == 'hegeldev/hegel' }}
    needs: [lint, libhegel, rust, python, test-minimal-versions, coverage, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token: "enables the workflow to request and use an OIDC token from GitHub's OIDC provider".
      # Used by our trusted publishing flow
      id-token: write
    # Expose what released to the follow-on jobs. `c_released` lets the
    # cross-platform libhegel library builds run only when libhegel changed —
    # a frontend-only release ships no new binaries; `version` is the
    # post-bump libhegel version and `libhegel_tag` the `libhegel/<version>`
    # tag release.py cut for it, which they check out and upload against.
    # `python_released` / `python_tag` do the same for the Python wheel
    # builds. Each is read off the tags release.py left on the release
    # commit, so a frontend dragged along by a libhegel release counts too.
    outputs:
      c_released: ${{ steps.released.outputs.libhegel_tag != '' }}
      version: ${{ steps.released.outputs.libhegel_version }}
      libhegel_tag: ${{ steps.released.outputs.libhegel_tag }}
      python_released: ${{ steps.released.outputs.python_tag != '' }}
      python_tag: ${{ steps.released.outputs.python_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check for release files
        id: check
        run: |
          # Every component release.py knows keeps its RELEASE.md at one
          # of these paths.
          skip=true
          for f in libhegel/RELEASE.md frontends/*/RELEASE.md; do
            if [ -f "$f" ]; then
              skip=false
            fi
          done
          if [ "$skip" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        if: steps.check.outputs.skip != 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel

      - name: Re-checkout with app token # zizmor: ignore[artipacked]
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        if: steps.check.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python libhegel/scripts/check-release-rust.py

      - name: Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEGEL_RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python .github/scripts/release.py release

      # Which components release.py tagged. An empty tag means that component
      # did not release this time; a present libhegel tag must come with a
      # version in its manifest.
      - name: Capture released versions
        id: released
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          libhegel_tag=$(git tag --points-at HEAD --list 'libhegel/*')
          rust_tag=$(git tag --points-at HEAD --list 'frontends/rust/*')
          python_tag=$(git tag --points-at HEAD --list 'frontends/python/*')
          if [ -z "$libhegel_tag$rust_tag$python_tag" ]; then
            echo "release.py left no release tag on the release commit" >&2
            exit 1
          fi
          libhegel_version=$(grep '^version' libhegel/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          {
            echo "libhegel_tag=$libhegel_tag"
            echo "libhegel_version=$libhegel_version"
            echo "rust_tag=$rust_tag"
            echo "python_tag=$python_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: steps.check.outputs.skip != 'true' && (steps.released.outputs.rust_tag != '' || steps.released.outputs.libhegel_tag != '')
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3
        id: crates-io-auth

      - name: Publish hegeltest-macros
        if: steps.check.outputs.skip != 'true' && steps.released.outputs.rust_tag != ''
        run: cargo publish -p hegeltest-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Wait for crates.io index
        if: steps.check.outputs.skip != 'true' && steps.released.outputs.rust_tag != ''
        run: |
          VERSION=$(grep '^version' frontends/rust/macros/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "waiting for hegeltest-macros $VERSION to appear on crates.io..."
          for i in $(seq 1 60); do
            if cargo search hegeltest-macros | grep -q "\"$VERSION\""; then
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for hegeltest-macros to appear on Crates.io"
          exit 1

      - name: Publish hegeltest-c
        if: steps.check.outputs.skip != 'true' && steps.released.outputs.libhegel_tag != ''
        # The engine crate. hegeltest depends on it, so it must be published
        # (and indexed) before hegeltest. Its other role is to reserve the
        # name; the useful artefact for non-Rust consumers is the
        # `libhegel-<goos>-<goarch>.<ext>` binaries uploaded by the
        # `release-binaries` job, not this source crate. Only published when
        # libhegel actually changed — its version is independent of the Rust
        # frontend's, so a frontend-only release leaves it at its
        # already-published version.
        run: cargo publish -p hegeltest-c
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Wait for hegeltest-c on crates.io index
        if: steps.check.outputs.skip != 'true' && steps.released.outputs.libhegel_tag != ''
        run: |
          VERSION=$(grep '^version' libhegel/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "waiting for hegeltest-c $VERSION to appear on crates.io..."
          for i in $(seq 1 60); do
            if cargo search hegeltest-c | grep -q "\"$VERSION\""; then
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for hegeltest-c to appear on Crates.io"
          exit 1

      - name: Publish hegeltest
        if: steps.check.outputs.skip != 'true' && steps.released.outputs.rust_tag != ''
        # HEGEL_C_LIB_DIR keeps the publish verify build from depending on
        # the just-published hegeltest-c being visible in the registry yet.
        run: |
          cargo build -p hegeltest-c
          HEGEL_C_LIB_DIR="$PWD/target/debug" cargo publish -p hegeltest
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Push to main or open PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python .github/scripts/release.py push-or-pr

  # Cross-platform shared and static library builds for libhegel. Triggers
  # after the `release` job has tagged a new version; each matrix entry builds
  # for one Go-style (GOOS, GOARCH) target, gives both libraries stable release
  # names, computes SHA-256 sidecars, and uploads them to the GitHub Release.
  release-binaries:
    # `platform` is the primary matrix dimension; the include entries
    # specialise the runner / Rust target / file extension for each
    # platform. Structuring it this way lets GitHub's auto-suffix render
    # cleanly as "release-binaries (linux-amd64)" etc. when the matrix
    # expands, and lets the *skipped* form collapse to a single
    # "release-binaries" entry on non-release pushes — instead of
    # showing the literal `${{ matrix.X }}` template, which GitHub does
    # not interpolate when a job-level `if:` evaluates to false before
    # matrix expansion.
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.c_released == 'true'
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
          - darwin-arm64
          - windows-amd64
          - windows-arm64
        include:
          - { platform: linux-amd64,   runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,    goos: linux,   goarch: amd64, shared_ext: so,    static_ext: a }
          - { platform: linux-arm64,   runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   goos: linux,   goarch: arm64, shared_ext: so,    static_ext: a }
          # Intel macOS (darwin-amd64) is intentionally not built: the
          # macos-13 (x86_64) runners are scarce and routinely leave the
          # release job stuck for hours waiting for a runner, and we do not
          # support Intel Macs. Apple-silicon macOS is covered below.
          - { platform: darwin-arm64,  runner: macos-14,         target: aarch64-apple-darwin,        goos: darwin,  goarch: arm64, shared_ext: dylib, static_ext: a }
          - { platform: windows-amd64, runner: windows-latest,   target: x86_64-pc-windows-msvc,      goos: windows, goarch: amd64, shared_ext: dll,   static_ext: lib }
          # aarch64-pc-windows-msvc is cross-compiled from the x86_64 runner.
          # MSVC has had built-in arm64 cross since VS 2017+ and
          # windows-latest ships the toolchain.
          - { platform: windows-arm64, runner: windows-latest,   target: aarch64-pc-windows-msvc,     goos: windows, goarch: arm64, shared_ext: dll,   static_ext: lib }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.libhegel_tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The release job tags before pushing the bump commit; fetch
          # tags so we can check out the new tag rather than gambling on
          # main's HEAD pointer.
          fetch-depth: 0
          ref: refs/tags/${{ needs.release.outputs.libhegel_tag }}

      - name: Install Rust + target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python libhegel/scripts/check-release-rust.py
          rustup target add ${{ matrix.target }}

      - name: Build libraries
        run: cargo build -p hegeltest-c --release --target ${{ matrix.target }}

      - name: Stage assets + sha256
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          shared_asset="libhegel-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.shared_ext }}"
          static_asset="libhegel-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.static_ext }}"
          case "${{ matrix.goos }}" in
            windows)
              shared_built="target/${{ matrix.target }}/release/hegel_c.dll"
              static_built="target/${{ matrix.target }}/release/hegel_c.lib"
              ;;
            darwin)
              shared_built="target/${{ matrix.target }}/release/libhegel_c.dylib"
              static_built="target/${{ matrix.target }}/release/libhegel_c.a"
              ;;
            linux)
              shared_built="target/${{ matrix.target }}/release/libhegel_c.so"
              static_built="target/${{ matrix.target }}/release/libhegel_c.a"
              ;;
            *) echo "unknown goos: ${{ matrix.goos }}" >&2; exit 1 ;;
          esac
          for built in "$shared_built" "$static_built"; do
            if [ ! -f "$built" ]; then
              echo "expected library output $built missing" >&2
              ls -la "target/${{ matrix.target }}/release/" || true
              exit 1
            fi
          done
          cp "$shared_built" "$shared_asset"
          cp "$static_built" "$static_asset"
          for asset in "$shared_asset" "$static_asset"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
          done
          echo "shared_asset=$shared_asset" >> "$GITHUB_OUTPUT"
          echo "static_asset=$static_asset" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARED_ASSET: ${{ steps.stage.outputs.shared_asset }}
          STATIC_ASSET: ${{ steps.stage.outputs.static_asset }}
        run: |
          set -euo pipefail
          tag="$TAG"
          assets=(
            "$SHARED_ASSET"
            "$SHARED_ASSET.sha256"
            "$STATIC_ASSET"
            "$STATIC_ASSET.sha256"
          )
          if [ "${{ matrix.platform }}" = linux-amd64 ]; then
            cp libhegel/include/hegel.h hegel.h
            sha256sum hegel.h > hegel.h.sha256
            assets+=(hegel.h hegel.h.sha256)
          fi
          # The `release` job creates the Release as a draft up front, so
          # normally `gh release view` finds it and we go straight to upload.
          # The `--draft` fallback only fires if that release is somehow
          # absent: assets must land in a *draft* release because GitHub's
          # immutable releases feature locks a release's assets once it is
          # published. `release-binaries-verify` publishes it afterwards.
          # `--clobber` makes re-runs (e.g. after a flaked build) idempotent.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --title "libhegel v${VERSION}" \
              --notes "libhegel ${VERSION} binaries. See libhegel/CHANGELOG.md for the full changelog." \
              || true
          fi
          gh release upload "$tag" "${assets[@]}" --clobber

  release-wasm:
    name: release-wasm
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.c_released == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.libhegel_tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ needs.release.outputs.libhegel_tag }}

      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python libhegel/scripts/check-release-rust.py
          rustup target add wasm32-unknown-unknown
      - name: Build WebAssembly artifact
        run: cargo build -p hegeltest-c --release --target wasm32-unknown-unknown
      - name: Build WebAssembly static archive
        run: cargo rustc -p hegeltest-c --release --target wasm32-unknown-unknown --features wasm-static --crate-type staticlib
      - name: Stage WebAssembly assets
        shell: bash
        run: |
          set -euo pipefail
          wasm_asset="libhegel-wasm32-unknown-unknown.wasm"
          static_asset="libhegel-wasm32-unknown-unknown.a"
          cp target/wasm32-unknown-unknown/release/hegel_c.wasm "$wasm_asset"
          cp target/wasm32-unknown-unknown/release/libhegel_c.a "$static_asset"
          sha256sum "$wasm_asset" > "$wasm_asset.sha256"
          sha256sum "$static_asset" > "$static_asset.sha256"
      - name: Upload WebAssembly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" libhegel-wasm32-unknown-unknown.wasm libhegel-wasm32-unknown-unknown.wasm.sha256 libhegel-wasm32-unknown-unknown.a libhegel-wasm32-unknown-unknown.a.sha256 --clobber

  # Independent post-condition check that every expected libhegel asset is
  # present on the Release. `release-binaries` uses `fail-fast: false` so
  # failed-platform diagnostics aren't lost; this aggregator job fails
  # loudly when any expected asset (or its sidecar) is missing.
  release-binaries-verify:
    name: release-binaries-verify
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.c_released == 'true'
    needs: [release, release-binaries, release-wasm]
    runs-on: ubuntu-latest
    # `contents: write` (not just read) so this job can both view the draft
    # release — drafts are invisible to read-only tokens — and publish it
    # once every expected asset is present.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.libhegel_tag }}
    steps:
      - name: Check that every expected asset uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$TAG"
          expected=(
            hegel.h
            libhegel-wasm32-unknown-unknown.wasm
            libhegel-wasm32-unknown-unknown.a
            libhegel-linux-amd64.so
            libhegel-linux-amd64.a
            libhegel-linux-arm64.so
            libhegel-linux-arm64.a
            libhegel-darwin-arm64.dylib
            libhegel-darwin-arm64.a
            libhegel-windows-amd64.dll
            libhegel-windows-amd64.lib
            libhegel-windows-arm64.dll
            libhegel-windows-arm64.lib
          )
          actual=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name')
          missing=()
          for a in "${expected[@]}"; do
            grep -qxF "$a" <<<"$actual" || missing+=("$a")
            grep -qxF "$a.sha256" <<<"$actual" || missing+=("$a.sha256")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Release $tag is missing assets:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All expected libhegel assets present on $tag."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$TAG"
          # Un-draft the release now that every asset is verified present.
          # Publishing is what makes the release (and its assets) immutable,
          # so it must happen last.
          gh release edit "$tag" --repo "$REPO" --draft=false
          echo "Published release $tag."

  # The Python frontend's wheels, one job per platform (the libhegel binary
  # platforms less windows-arm64), each building for every supported CPython via
  # the composite action the PR `package` job also uses. They check out the
  # `frontends/python/<version>` tag the `release` job pushed; the sdist and
  # the PyPI upload follow in the next two jobs.
  release-python-wheels:
    name: release-python-wheels (${{ matrix.platform }})
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.python_released == 'true'
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64,   runner: ubuntu-latest }
          - { platform: linux-arm64,   runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64,  runner: macos-14 }
          - { platform: windows-amd64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ needs.release.outputs.python_tag }}
      - uses: ./.github/actions/setup-rust
        with:
          tools: just uv
      - uses: ./.github/actions/build-python-wheels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheels-${{ matrix.platform }}
          path: frontends/python/dist/*.whl
          if-no-files-found: error

  release-python-sdist:
    name: release-python-sdist
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.python_released == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ needs.release.outputs.python_tag }}
      - uses: ./.github/actions/install-tools
        with:
          tools: uv
      - name: Build the sdist
        working-directory: frontends/python
        run: uvx --from 'maturin>=1.9.3,<2.0' maturin sdist --out dist
      - name: Check the sdist's metadata against its contents
        run: python3 frontends/python/scripts/check_sdist.py frontends/python/dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: frontends/python/dist/*.tar.gz
          if-no-files-found: error

  # Upload every wheel and the sdist to PyPI through trusted publishing (the
  # `hegeltest` project trusts this repository's ci.yml). `skip-existing`
  # makes a re-run after a partial upload idempotent.
  release-python-publish:
    name: release-python-publish
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.python_released == 'true'
    needs: [release, release-python-wheels, release-python-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - name: List the distributions
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  # Notify each downstream language binding that still lives in its own repo
  # that a new libhegel release is live so it can bump its pinned version.
  # One matrix entry per consumer repo; remove an entry when that frontend
  # moves into this monorepo. Gated on `release-binaries-verify`, not just
  # `release`: the downstream bumps read the per-asset SHA-256 digests off
  # this release, so we only dispatch once every libhegel binary is confirmed
  # uploaded. `fail-fast: false` keeps a dispatch failure for one repo from
  # cancelling the others. The event type keeps its historical name so the
  # consumers' existing workflows keep matching.
  bump-libhegel:
    name: bump-libhegel
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel' && needs.release.outputs.c_released == 'true'
    needs: [release, release-binaries-verify]
    runs-on: ubuntu-latest
    # The cross-repo dispatch uses the app token below, not GITHUB_TOKEN.
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        repo: [hegel-go, hegel-ocaml, hegel-typescript, hegel-cpp]
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.repo }}

      - name: Dispatch hegel-rust-release to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.libhegel_tag }}
          REPO: ${{ matrix.repo }}
        run: |
          gh api "repos/hegeldev/$REPO/dispatches" \
            -f event_type=hegel-rust-release \
            -F "client_payload[version]=$VERSION" \
            -F "client_payload[tag]=$TAG"
