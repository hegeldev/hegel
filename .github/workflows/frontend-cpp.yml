# CI for the C++ frontend (the `hegel` CMake library in frontends/cpp/,
# driving libhegel in-process through its C ABI). Called from ci.yml when
# the frontend, libhegel (which it links) or the shared workspace changed.
# Every job builds the in-tree engine: cmake/libhegel.cmake runs
# `cargo build --release -p hegeltest-c` itself, so each job starts with
# a Rust toolchain and never fetches a released binary.
name: cpp

on:
  workflow_call:

permissions: {}

jobs:
  # The test suite (with and without the throw-site hook) on every supported
  # compiler and standard library.
  test:
    name: test (${{ matrix.compiler }}${{ matrix.stdlib && format(' with {0}', matrix.stdlib) || '' }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-13
            cc: gcc-13
            cxx: g++-13

          - compiler: g++-11
            cc: gcc-11
            cxx: g++-11
            packages: g++-11

          - compiler: clang++-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18

          - compiler: clang++-18
            cc: clang-18
            cxx: clang++-18
            stdlib: libc++
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            cmake_flags: -DCMAKE_CXX_FLAGS="-stdlib=libc++"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install compiler
        if: matrix.packages
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y $PACKAGES
      - uses: ./.github/actions/setup-rust
      - name: Run tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_FLAGS: ${{ matrix.cmake_flags }}
        run: just cpp::check-tests

  # Apple clang and libc++, only in the merge queue and on main since macOS
  # runners are scarce.
  test-macos:
    name: test (macos)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Run tests
        env:
          CC: cc
          CXX: c++
        run: just cpp::check-tests

  # The library consumed the ways a downstream project would: as a
  # subdirectory, through FetchContent (of the monorepo, with the frontend
  # as its source subdirectory), from an installed package, and with its own
  # tests switched on.
  consumer:
    name: consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Run consumer tests
        run: just cpp::check-consumer-all

  # The library built and installed with HEGEL_REFLECTION=OFF, consumed from
  # a strict C++17 project.
  cxx17:
    name: cxx17
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build and run the C++17 consumer (HEGEL_REFLECTION=OFF)
        run: just cpp::check-cxx17

  # Every non-excluded line of src/ and include/hegel/ must be covered, and
  # the coverage-exclusion markers must not exceed the ratchet in
  # frontends/cpp/coverage-ratchet.json.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install clang + llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - uses: ./.github/actions/setup-rust
      - name: Enforce coverage floor
        env:
          CC: clang-18
          CXX: clang++-18
        run: just cpp::check-coverage

  # address+undefined and thread sanitizer builds of the suite.
  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - uses: ./.github/actions/setup-rust
      - name: Run sanitizers (address+undefined, thread)
        env:
          CC: clang-18
          CXX: clang++-18
        run: just cpp::check-sanitizers

  # The API reference (Doxygen), with warnings as errors. Configuring the
  # project needs cargo even though the docs target never builds the engine.
  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: just doxygen
      - name: Build the documentation
        run: just cpp::check-docs

  # The Nix flake (nix/flake.nix): a consumer project built by nix-build
  # against the flake's package, with the engine built from the in-tree
  # libhegel by the root flake. nixfmt runs in ci.yml's nix job.
  nix:
    name: nix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: ./.github/actions/install-tools
        with:
          tools: just
      - name: Build and run the Nix consumer project
        run: just cpp::check-nix
